name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@v1.10.0
        with:
          mongodb-version: '6.0'
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (backend)
        run: |
          cd backend
          npm ci
      - name: Run backend tests
        run: |
          cd backend
          npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/movie-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-backend:latest
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/movie-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/movie-frontend:latest

  terraform-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform Init (env)
        run: |
          cd infra
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            terraform init -reconfigure -backend-config=prod/backend.prod.config
          else
            terraform init -reconfigure -backend-config=dev/backend.dev.config
          fi
      - name: Terraform Plan (env)
        run: |
          cd infra
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            terraform plan -var-file=prod/prod.tfvars
          else
            terraform plan -var-file=dev/dev.tfvars
          fi
      - name: Terraform Apply (env)
        run: |
          cd infra
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            terraform apply -auto-approve -var-file=prod/prod.tfvars -var="admin_password=${{ secrets.ADMIN_PASSWORD }}"
          else
            terraform apply -auto-approve -var-file=dev/dev.tfvars
          fi

  deploy-to-vm:
    needs: terraform-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker and Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.VM_PUBLIC_IP_PROD || secrets.VM_PUBLIC_IP_DEV }}
          username: ${{ github.event.inputs.environment == 'prod' && secrets.VM_SSH_USER_PROD || secrets.VM_SSH_USER_DEV }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.VM_SSH_KEY_PROD || secrets.VM_SSH_KEY_DEV }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
              newgrp docker
            fi
            # Install Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              if command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y docker-compose-plugin
              fi
            fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.VM_PUBLIC_IP_PROD || secrets.VM_PUBLIC_IP_DEV }}
          username: ${{ github.event.inputs.environment == 'prod' && secrets.VM_SSH_USER_PROD || secrets.VM_SSH_USER_DEV }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.VM_SSH_KEY_PROD || secrets.VM_SSH_KEY_DEV }}
          script: |
            # Ensure code is up-to-date
            REPO_DIR="/home/azureuser/Movie-Review"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            if [ ! -d "$REPO_DIR" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git pull origin main || git pull origin master
            fi
            cd "$REPO_DIR"
            # Docker login for private images
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans