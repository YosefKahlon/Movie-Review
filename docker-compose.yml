# Docker Compose for backend, frontend, and MongoDB
version: '3.8'
services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-kinwon}/movie-frontend:latest
    depends_on:
      - backend
    networks:
      - appnet
    volumes:
      - frontend_build:/app

  backend:
    image: ${DOCKERHUB_USERNAME:-kinwon}/movie-backend:latest
    command: npm run dev
    volumes:
      - ./backend:/app
    environment:
      MONGODB_URI: mongodb://mongo:27017/moviedb
    depends_on:
      - mongo
    networks:
      - appnet

  mongo:
    image: mongo:7
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mongo_data:
  frontend_build:
